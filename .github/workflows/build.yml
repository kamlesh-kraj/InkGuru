name: Build InkGuru

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build Windows App
        run: flutter build windows --release -v > build_log.txt 2>&1
        continue-on-error: true

      - name: Push log to debug branch
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git checkout -b debug-logs
          git add build_log.txt
          git commit -m "Upload build log"
          git push origin debug-logs --force

      - name: Check Build Status
        run: |
          if (-Not (Test-Path "build\windows\x64\runner\Release\inkguru.exe") -and -Not (Test-Path "build\windows\runner\Release\inkguru.exe")) { Write-Error "Executable not found"; exit 1 }

      - name: Zip Windows Build
        run: |
          $buildPath = "build\windows\x64\runner\Release"
          if (-Not (Test-Path $buildPath)) {
            $buildPath = "build\windows\runner\Release"
          }
          if (Test-Path $buildPath) {
            Compress-Archive -Path "$buildPath\*" -DestinationPath inkguru-windows.zip -Force
          } else {
            Write-Error "Build output not found at either location."
            exit 1
          }

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkguru-windows-app
          path: inkguru-windows.zip
          retention-days: 7
